
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzles | Moonchess</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Solve chess puzzles and earn mooncoins.">
  <link rel="stylesheet" href="style.css">

  <style>
    .puzzle-wrap {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 2rem;
    }

    .board {
      width: min(100%, 560px);
      flex: 1 1 480px;
      min-width: 0;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 3px #2E1A4A;
      touch-action: none;
    }

    .puzzle-panel {
      flex: 0 1 310px;
      min-width: 0;
      background: rgba(46, 26, 74, 0.35);
      border: 2px solid #2E1A4A;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: left;
    }

    #puzzle-count {
      margin: 0;
      color: #B9A5E3;
    }

    #puzzle-title {
      font-size: 2rem;
      margin: 0.25rem 0 0.75rem;
    }

    #status {
      min-height: 3em;
      margin: 0 0 1rem;
    }

    #status.good {
      color: #FFD84D;
      font-weight: 700;
    }

    #status.bad {
      color: #FF9AA2;
    }

    .instructions {
      margin-bottom: 1.5rem;
      color: #E2D9F3;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      padding: 0;
      font: inherit;
      font-size: clamp(20px, 5vw, 56px);
      line-height: 1;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    .sq.light {
      background: #B9A5E3;
    }

    .sq.dark {
      background: #6B4BA3;
    }


    /* Chess coordinates: rank on the left, file along the bottom. */
    .sq .coordinate {
      position: absolute;
      z-index: 4;
      pointer-events: none;
      font-family: Arial, sans-serif;
      font-size: clamp(9px, 1.2vw, 12px);
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }
    .sq.light .coordinate { color: #49316f; }
    .sq.dark .coordinate { color: #e9dcff; }
    .sq .rank-label { top: 4px; left: 4px; }
    .sq .file-label { bottom: 4px; right: 4px; }

    .sq.last::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 216, 77, 0.35);
      pointer-events: none;
    }

    .sq.selected,
    .sq.hint {
      box-shadow: inset 0 0 0 4px #FFD84D;
    }

    .piece {
      position: relative;
      z-index: 1;
      font-family: "DejaVu Sans", "Segoe UI Symbol", sans-serif;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      pointer-events: none;
    }

    .piece.w {
      color: #FFF6D6;
      text-shadow:
        0 2px 2px #1E1033,
        1px 0 #1E1033,
        -1px 0 #1E1033;
    }

    .piece.b {
      color: #1E1033;
      text-shadow: 0 1px 1px #F5F0FA;
    }

    .sq.dragging .piece {
      opacity: 0;
    }

    .drag-piece {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DejaVu Sans", "Segoe UI Symbol", sans-serif;
      line-height: 1;
      transform: translate(-50%, -65%) scale(1.2);
      filter: drop-shadow(0 12px 8px rgba(0, 0, 0, 0.6));
    }

    .drag-piece.w {
      color: #FFF6D6;
      text-shadow: 0 2px 2px #1E1033;
    }

    .drag-piece.b {
      color: #1E1033;
      text-shadow: 0 1px 1px #F5F0FA;
    }

    /* Chess.com-style legal move indicators. */
    .sq.legal-dot::after {
      content: "";
      position: absolute;
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: rgba(30, 16, 51, 0.32);
      pointer-events: none;
      z-index: 2;
    }

    .sq.legal-capture::after {
      content: "";
      position: absolute;
      inset: 5%;
      border: max(4px, 0.45vw) solid rgba(30, 16, 51, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .sq.drop-target {
      box-shadow: inset 0 0 0 4px #FFD84D;
    }

    .sound-control { margin-top: 1rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      font: inherit;
      font-weight: 700;
      padding: 0.65rem 1.2rem;
      border-radius: 8px;
      border: 2px solid #6B4BA3;
      background: transparent;
      color: #F5F0FA;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      background: #2E1A4A;
    }

    .btn.primary {
      background: #FFD84D;
      border-color: #FFD84D;
      color: #1E1033;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn:focus-visible,
    .sq:focus-visible {
      outline: 3px solid #FFD84D;
      outline-offset: -3px;
    }

    @keyframes shake {
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .board.shake {
      animation: shake 0.3s;
    }

    @media (prefers-reduced-motion: reduce) {
      .board.shake {
        animation: none;
      }
    }

    @media (max-width: 1000px) {
      .puzzle-wrap {
        flex-direction: column;
        align-items: center;
      }

      .board {
        width: min(100%, 560px);
        flex: none;
      }

      .puzzle-panel {
        width: min(100%, 560px);
        flex: none;
      }
    }
  </style>
</head>

<body class="home">
  <div class="layout">
    <aside class="sidebar">
      <a class="logo" href="index.html">Moonchess</a>

      <nav class="tabs" aria-label="Main">
        <a class="tab" href="index.html">Home</a>
        <a class="tab" href="puzzles.html" aria-current="page">Puzzles</a>
        <span class="tab disabled" aria-disabled="true">
          Courses <small>Soon</small>
        </span>
      </nav>

      <div class="side-coins" aria-live="polite">
        <span class="coin-dot"></span>
        <span>
          <span id="coin-count">0</span> mooncoins
        </span>
      </div>
    </aside>

    <main class="content">
      <div class="puzzle-wrap">
        <div
          id="board"
          class="board"
          role="group"
          aria-label="Chess board"
        ></div>

        <div class="puzzle-panel">
          <p id="puzzle-count"></p>
          <h1 id="puzzle-title"></h1>
          <p id="status" role="status" aria-live="polite"></p>

          <div class="instructions">
            <p><strong>How to play:</strong></p>
            <p>
              Drag a piece to its destination, or click a piece
              and then its destination square. Finish the checkmate sequence to earn
              10 mooncoins the first time you solve each puzzle.
            </p>
          </div>

          <div class="controls">
            <button type="button" id="hint-btn" class="btn">
              Hint
            </button>
            <button type="button" id="restart-btn" class="btn">
              Restart
            </button>
            <button type="button" id="next-btn" class="btn">
              Next puzzle
            </button>
          </div>
          <div class="sound-control"><button type="button" id="sound-btn" class="btn" aria-pressed="true">Sound: On</button></div>
        </div>
      </div>
    </main>
  </div>

  <script src="mate1.js"></script>
  <script src="mate2.js"></script>
  <script src="mate3.js"></script>
  <script type="module">
"use strict";
import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";

const FILES = "abcdefgh";
const PIECE_NAMES = {k:"king",q:"queen",r:"rook",b:"bishop",n:"knight",p:"pawn"};
const COIN_KEY = "moonchess.coins";
const SOLVED_KEY = "moonchess.solved";
const boardEl = document.getElementById("board");
const countEl = document.getElementById("puzzle-count");
const titleEl = document.getElementById("puzzle-title");
const statusEl = document.getElementById("status");
const coinEl = document.getElementById("coin-count");
const hintBtn = document.getElementById("hint-btn");
const restartBtn = document.getElementById("restart-btn");
const nextBtn = document.getElementById("next-btn");
const soundBtn = document.getElementById("sound-btn");
const SOUND_KEY = "moonchess.sound";
let soundOn = true;
try { soundOn = localStorage.getItem(SOUND_KEY) !== "off"; } catch {}
let audioCtx = null;
function updateSoundButton() {
  soundBtn.textContent = soundOn ? "Sound: On" : "Sound: Off";
  soundBtn.setAttribute("aria-pressed", String(soundOn));
}
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch {}
  updateSoundButton();
  if (soundOn) playSound("move");
});
updateSoundButton();
function playSound(kind) {
  if (!soundOn) return;
  try {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return;
    if (!audioCtx) audioCtx = new Context();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    const now = audioCtx.currentTime;
    const notes = kind === "mate" ? [[660,0,.11],[880,.13,.17],[1100,.33,.22]]
      : kind === "error" ? [[220,0,.11],[165,.12,.15]]
      : kind === "capture" ? [[180,0,.055],[120,.045,.09]]
      : kind === "check" ? [[520,0,.09],[680,.1,.1]]
      : [[410,0,.045],[310,.045,.06]];
    for (const [freq,delay,duration] of notes) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = kind === "mate" ? "sine" : "triangle";
      osc.frequency.setValueAtTime(freq, now+delay);
      gain.gain.setValueAtTime(0.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(0.065,now+delay+.008);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now+delay); osc.stop(now+delay+duration+.01);
    }
  } catch (e) { console.warn("Audio unavailable",e); }
}


function readStore(key, fallback) {
  try { const raw=localStorage.getItem(key); return raw===null ? fallback : JSON.parse(raw); }
  catch { return fallback; }
}
function writeStore(key,value) { try { localStorage.setItem(key,JSON.stringify(value)); } catch {} }
let coins = readStore(COIN_KEY,0);
if (!Number.isFinite(coins) || coins<0) coins=0;
let solvedIds = readStore(SOLVED_KEY,[]);
if (!Array.isArray(solvedIds)) solvedIds=[];
const solvedSet = new Set(solvedIds);
const pools = [
  ...MOONCHESS_MATEIN1.map(p=>({...p, mate:1})),
  ...MOONCHESS_MATEIN2.map(p=>({...p, mate:2})),
  ...MOONCHESS_MATEIN3.map(p=>({...p, mate:3}))
];
let bag=[];
let puzzle=null;
let chess=null;
let playerColor="w";
let step=0;
let selected=null;
let hintSquare=null;
let lastMove=[];
let solved=false;
let thinking=false;
let runId=0;
let drag=null;
let suppressClick=false;
let clickResetTimer=null;

function sqIndex(name) { return (8-Number(name[1]))*8+FILES.indexOf(name[0]); }
function sqName(i) { return FILES[i%8]+(8-Math.floor(i/8)); }
function setStatus(message,type="") { statusEl.textContent=message; statusEl.className=type; }
function updateCoins() { coinEl.textContent=coins; }
function shuffle(a) {
  for(let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function nextRandomPuzzle() {
  if (!bag.length) bag=shuffle(pools.slice());
  return bag.pop();
}
function pieceAt(index) {
  const piece=chess.get(sqName(index));
  return piece ? {color:piece.color,type:piece.type} : null;
}
function playUci(uci) {
  try { return chess.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||"q"}); }
  catch { return null; }
}
function showTurn() {
  setStatus((playerColor==="w" ? "White" : "Black") + " to move. Find the mate in " + puzzle.mate + ".");
}
function loadPuzzle(newPuzzle) {
  cleanupDrag();
  runId++;
  puzzle=newPuzzle;
  try { chess=new Chess(puzzle.fen); }
  catch(e) { console.error("Bad puzzle FEN",puzzle.id,e); setStatus("Could not load this puzzle. Try Next puzzle.","bad"); return; }
  playerColor=chess.turn();
  step=0; selected=null; hintSquare=null; lastMove=[]; solved=false; thinking=false;
  titleEl.textContent="Mate in " + puzzle.mate;
  countEl.textContent=pools.length + " puzzles · Random order";
  nextBtn.classList.remove("primary");
  hintBtn.disabled=false;
  showTurn();
  renderBoard();
}
function renderBoard() {
  if (!chess) return;
  boardEl.replaceChildren();
  const flipped=playerColor==="b";
  for(let display=0;display<64;display++) {
    const i=flipped ? 63-display : display;
    const row=Math.floor(i/8),col=i%8;
    const square=document.createElement("button");
    square.type="button"; square.dataset.index=i;
    square.className="sq "+((row+col)%2===0?"light":"dark");
    if(selected===i) square.classList.add("selected");
    if(hintSquare===i) square.classList.add("hint");
    if(lastMove.includes(i)) square.classList.add("last");
    if(selected!==null && !thinking && !solved) {
      const from=sqName(selected);
      const destinations=chess.moves({square:from,verbose:true});
      if(destinations.some(move=>move.to===sqName(i))) {
        const isCapture=destinations.some(move=>move.to===sqName(i) && (move.isCapture() || move.isEnPassant()));
        square.classList.add(isCapture ? "legal-capture" : "legal-dot");
      }
    }
    const piece=pieceAt(i);
    square.setAttribute("aria-label",piece ? `${sqName(i)} ${piece.color==="w"?"white":"black"} ${PIECE_NAMES[piece.type]}` : sqName(i));
    if(piece) {
      const span=document.createElement("span");
      span.className="piece "+piece.color;
      span.setAttribute("aria-hidden","true");
      const img=document.createElement("img");
      img.src=(piece.color==="w"?"white-":"black-")+PIECE_NAMES[piece.type]+".png";
      img.alt=""; img.draggable=false;
      img.style.width="90%"; img.style.height="90%";
      img.style.objectFit="contain"; img.style.pointerEvents="none";
      span.appendChild(img); square.appendChild(span);
    }
    // Coordinates follow the player's board orientation.
    if(display % 8 === 0) {
      const rank=document.createElement("span");
      rank.className="coordinate rank-label";
      rank.textContent=sqName(i)[1];
      rank.setAttribute("aria-hidden","true");
      square.appendChild(rank);
    }
    if(Math.floor(display / 8) === 7) {
      const file=document.createElement("span");
      file.className="coordinate file-label";
      file.textContent=sqName(i)[0];
      file.setAttribute("aria-hidden","true");
      square.appendChild(file);
    }
    square.addEventListener("click",()=>handleSquareClick(i));
    boardEl.appendChild(square);
  }
}
function completePuzzle() {
  playSound("mate");
  solved=true; thinking=false;
  hintBtn.disabled=true;
  nextBtn.classList.add("primary");
  const key="lichess:"+puzzle.id;
  if (!solvedSet.has(key)) {
    solvedSet.add(key);
    writeStore(SOLVED_KEY,Array.from(solvedSet));
    coins+=10; writeStore(COIN_KEY,coins); updateCoins();
    setStatus("Checkmate! +10 mooncoins.","good");
  } else setStatus("Checkmate! You've already earned coins for this puzzle.","good");
}
function handleSquareClick(index) {
  if (!chess || solved || thinking) return;
  const piece=pieceAt(index);
  const own=piece && piece.color===playerColor;
  if(selected===null) { if(own) {selected=index;hintSquare=null;renderBoard();} return; }
  if(selected===index) {selected=null;renderBoard();return;}
  if(own) {selected=index;renderBoard();return;}
  const attempt=sqName(selected)+sqName(index);
  const expected=puzzle.moves[step];
  // Match the exact solution; queen promotion is the default when no promotion is specified.
  if (attempt!==expected.slice(0,4)) {
    playSound("error");
    selected=null; setStatus("Not quite — try again!","bad");
    boardEl.classList.remove("shake"); void boardEl.offsetWidth; boardEl.classList.add("shake");
    renderBoard(); return;
  }
  const moved=playUci(expected);
  if (!moved) { selected=null;setStatus("Puzzle move error. Try Next puzzle.","bad");renderBoard();return; }
  playSound(moved.isCapture() || moved.isEnPassant() ? "capture" : chess.isCheck() ? "check" : "move");
  lastMove=[sqIndex(expected.slice(0,2)),sqIndex(expected.slice(2,4))];
  selected=null;hintSquare=null;step++;
  renderBoard();
  if(step>=puzzle.moves.length) {
    if(chess.isCheckmate()) completePuzzle();
    else setStatus("Puzzle data error: final position is not checkmate.","bad");
    return;
  }
  thinking=true;
  setStatus("Good move! Opponent is responding...");
  const thisRun=runId;
  setTimeout(()=>{
    if(thisRun!==runId) return;
    const reply=puzzle.moves[step];
    const opponentMove=playUci(reply);
    if(!opponentMove) {thinking=false;setStatus("Opponent move error. Try Next puzzle.","bad");return;}
    playSound(opponentMove.isCapture() || opponentMove.isEnPassant() ? "capture" : chess.isCheck() ? "check" : "move");
    lastMove=[sqIndex(reply.slice(0,2)),sqIndex(reply.slice(2,4))];
    step++;thinking=false;
    showTurn();renderBoard();
  },500);
}
hintBtn.addEventListener("click",()=>{
  if(!puzzle || solved || thinking) return;
  const move=puzzle.moves[step];
  hintSquare=sqIndex(move.slice(0,2));
  setStatus("Hint: Move the highlighted piece.");renderBoard();
});
restartBtn.addEventListener("click",()=>{if(puzzle)loadPuzzle(puzzle);});
nextBtn.addEventListener("click",()=>{if(pools.length)loadPuzzle(nextRandomPuzzle());});

function findBoardSquare(x,y) {
  const el=document.elementFromPoint(x,y);
  const sq=el?.closest(".sq");
  return sq && boardEl.contains(sq) ? sq : null;
}
function clearDropTargets() { boardEl.querySelectorAll(".drop-target").forEach(sq=>sq.classList.remove("drop-target")); }
function cleanupDrag() {
  if(!drag)return;
  const {sourceSquare,pointerId,ghost}=drag;
  ghost?.remove(); sourceSquare.classList.remove("dragging");clearDropTargets();
  if(sourceSquare.hasPointerCapture?.(pointerId))sourceSquare.releasePointerCapture(pointerId);
  drag=null;
}
boardEl.addEventListener("pointerdown",event=>{
  if(!chess||solved||thinking||drag||!event.isPrimary||event.button!==0)return;
  const square=event.target.closest(".sq");
  if(!square||!square.querySelector(".piece"))return;
  const from=Number(square.dataset.index),piece=pieceAt(from);
  if(!piece||piece.color!==playerColor)return;
  drag={pointerId:event.pointerId,from,piece,sourceSquare:square,startX:event.clientX,startY:event.clientY,moved:false,ghost:null};
  square.setPointerCapture(event.pointerId);
});
document.addEventListener("pointermove",event=>{
  if(!drag||event.pointerId!==drag.pointerId)return;
  if(!drag.moved) {
    if(Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)<5)return;
    drag.moved=true;
    const size=drag.sourceSquare.getBoundingClientRect().width;
    const ghost=document.createElement("div");
    ghost.className="drag-piece "+drag.piece.color;
    const img=document.createElement("img");
    img.src=(drag.piece.color==="w"?"white-":"black-")+PIECE_NAMES[drag.piece.type]+".png";
    img.alt="";img.draggable=false;
    img.style.width="100%";img.style.height="100%";img.style.objectFit="contain";
    ghost.appendChild(img);
    ghost.style.width=size+"px";ghost.style.height=size+"px";
    document.body.appendChild(ghost);drag.ghost=ghost;
    drag.sourceSquare.classList.add("dragging");
  }
  event.preventDefault();
  drag.ghost.style.left=event.clientX+"px";drag.ghost.style.top=event.clientY+"px";
  clearDropTargets();
  const target=findBoardSquare(event.clientX,event.clientY);
  if(target&&target!==drag.sourceSquare)target.classList.add("drop-target");
},{passive:false});
document.addEventListener("pointerup",event=>{
  if(!drag||event.pointerId!==drag.pointerId)return;
  const from=drag.from,wasMoved=drag.moved;
  const target=wasMoved?findBoardSquare(event.clientX,event.clientY):null;
  const to=target?Number(target.dataset.index):null;
  cleanupDrag();
  if(!wasMoved)return;
  suppressClick=true;clearTimeout(clickResetTimer);
  clickResetTimer=setTimeout(()=>{suppressClick=false;},350);
  if(to===null||to===from)return;
  selected=from;handleSquareClick(to);
});
document.addEventListener("pointercancel",event=>{if(drag&&event.pointerId===drag.pointerId)cleanupDrag();});
window.addEventListener("blur",cleanupDrag);
boardEl.addEventListener("click",event=>{
  if(!suppressClick)return;
  event.preventDefault();event.stopImmediatePropagation();
  suppressClick=false;clearTimeout(clickResetTimer);
},true);
updateCoins();
if(!pools.length)setStatus("No puzzles found. Check mate1.js, mate2.js, and mate3.js.","bad");
else loadPuzzle(nextRandomPuzzle());
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzles | Moonchess</title>
  <meta name="description" content="Solve chess puzzles and earn mooncoins.">
  <link rel="stylesheet" href="style.css">

  <style>
    .puzzle-wrap {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 2rem;
    }

    .board {
      width: min(100%, 560px);
      flex: 1 1 480px;
      min-width: 0;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 3px #2E1A4A;
    }

    .puzzle-panel {
      flex: 0 1 310px;
      min-width: 0;
      background: rgba(46, 26, 74, 0.35);
      border: 2px solid #2E1A4A;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: left;
    }

    #puzzle-count {
      margin: 0;
      color: #B9A5E3;
    }

    #puzzle-title {
      font-size: 2rem;
      margin: 0.25rem 0 0.75rem;
    }

    #status {
      min-height: 3em;
      margin: 0 0 1rem;
    }

    #status.good {
      color: #FFD84D;
      font-weight: 700;
    }

    #status.bad {
      color: #FF9AA2;
    }

    .instructions {
      margin-bottom: 1.5rem;
      color: #E2D9F3;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      padding: 0;
      font: inherit;
      font-size: clamp(20px, 5vw, 56px);
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .sq.light {
      background: #B9A5E3;
    }

    .sq.dark {
      background: #6B4BA3;
    }

    .sq.last::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 216, 77, 0.35);
      pointer-events: none;
    }

    .sq.selected,
    .sq.hint {
      box-shadow: inset 0 0 0 4px #FFD84D;
    }

    .piece {
      position: relative;
      z-index: 1;
      font-family: "DejaVu Sans", "Segoe UI Symbol", sans-serif;
    }

    .piece.w {
      color: #FFF6D6;
      text-shadow:
        0 2px 2px #1E1033,
        1px 0 #1E1033,
        -1px 0 #1E1033;
    }

    .piece.b {
      color: #1E1033;
      text-shadow: 0 1px 1px #F5F0FA;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      font: inherit;
      font-weight: 700;
      padding: 0.65rem 1.2rem;
      border-radius: 8px;
      border: 2px solid #6B4BA3;
      background: transparent;
      color: #F5F0FA;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      background: #2E1A4A;
    }

    .btn.primary {
      background: #FFD84D;
      border-color: #FFD84D;
      color: #1E1033;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn:focus-visible,
    .sq:focus-visible {
      outline: 3px solid #FFD84D;
      outline-offset: -3px;
    }

    @keyframes shake {
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .board.shake {
      animation: shake 0.3s;
    }

    @media (prefers-reduced-motion: reduce) {
      .board.shake { animation: none; }
    }

    @media (max-width: 1000px) {
      .puzzle-wrap {
        flex-direction: column;
        align-items: center;
      }

      .board {
        width: min(100%, 560px);
        flex: none;
      }

      .puzzle-panel {
        width: min(100%, 560px);
        flex: none;
      }
    }
  </style>
</head>

<body class="home">
  <div class="layout">
    <aside class="sidebar">
      <a class="logo" href="index.html">Moonchess</a>

      <nav class="tabs" aria-label="Main">
        <a class="tab" href="index.html">Home</a>
        <a class="tab" href="puzzles.html" aria-current="page">Puzzles</a>
        <span class="tab disabled" aria-disabled="true">
          Courses <small>Soon</small>
        </span>
      </nav>

      <div class="side-coins" aria-live="polite">
        <span class="coin-dot"></span>
        <span>
          <span id="coin-count">0</span> mooncoins
        </span>
      </div>
    </aside>

    <main class="content">
      <div class="puzzle-wrap">

        <div id="board" class="board"
             role="group"
             aria-label="Chess board"></div>

        <div class="puzzle-panel">
          <p id="puzzle-count"></p>
          <h1 id="puzzle-title"></h1>
          <p id="status" role="status" aria-live="polite"></p>

          <div class="instructions">
            <p><strong>How to play:</strong></p>
            <p>
              Click a piece, then its destination square
              to find the best move. Each puzzle earns
              10 mooncoins the first time you solve it.
            </p>
          </div>

          <div class="controls">
            <button type="button" id="hint-btn" class="btn">
              Hint
            </button>
            <button type="button" id="restart-btn" class="btn">
              Restart
            </button>
            <button type="button" id="next-btn" class="btn">
              Next puzzle
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    "use strict";

    const FILES = "abcdefgh";

    const PIECE_NAMES = {
      k: "king",
      q: "queen",
      r: "rook",
      b: "bishop",
      n: "knight",
      p: "pawn"
    };

    const GLYPHS = {
      K: "♔", Q: "♕", R: "♖",
      B: "♗", N: "♘", P: "♙",
      k: "♚", q: "♛", r: "♜",
      b: "♝", n: "♞", p: "♟"
    };

    // Single-move puzzles with predefined solutions.
    const PUZZLES = [
      {
        id: "scholars-mate",
        title: "Scholar's mate",
        fen: "r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w - - 4 4",
        move: "h5f7"
      },
      {
        id: "back-rank-mate",
        title: "Back-rank mate",
        fen: "6k1/5ppp/8/8/8/8/5PPP/R5K1 w - - 0 1",
        move: "a1a8"
      },
      {
        id: "fools-mate",
        title: "Fool's mate",
        fen: "rnbqkbnr/pppp1ppp/8/4p3/6P1/5P2/PPPPP2P/RNBQKBNR b - - 0 2",
        move: "d8h4"
      },
      {
        id: "smothered-mate",
        title: "Smothered mate",
        fen: "6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1",
        move: "g5f7"
      },
      {
        id: "queen-mate",
        title: "Queen and king mate",
        fen: "7k/5K2/6Q1/8/8/8/8/8 w - - 0 1",
        move: "g6g7"
      }
    ];

    const COIN_KEY = "moonchess.coins";
    const SOLVED_KEY = "moonchess.solved";

    const boardEl = document.getElementById("board");
    const countEl = document.getElementById("puzzle-count");
    const titleEl = document.getElementById("puzzle-title");
    const statusEl = document.getElementById("status");
    const coinEl = document.getElementById("coin-count");
    const hintBtn = document.getElementById("hint-btn");
    const restartBtn = document.getElementById("restart-btn");
    const nextBtn = document.getElementById("next-btn");

    function readStore(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch {
        return fallback;
      }
    }

    function writeStore(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    let coins = readStore(COIN_KEY, 0);

    if (!Number.isFinite(coins) || coins < 0) {
      coins = 0;
    }

    let solvedIds = readStore(SOLVED_KEY, []);

    if (!Array.isArray(solvedIds)) {
      solvedIds = [];
    }

    let currentIdx = 0;
    let state;

    function sqIndex(name) {
      return (8 - Number(name[1])) * 8 +
        FILES.indexOf(name[0]);
    }

    function sqName(i) {
      return FILES[i % 8] +
        (8 - Math.floor(i / 8));
    }

    function isWhite(piece) {
      return piece !== "" &&
        piece === piece.toUpperCase();
    }

    function parseFen(fen) {
      const [placement, turn] = fen.split(" ");
      const board = [];

      for (const ch of placement.replace(/\//g, "")) {
        if (/^[1-8]$/.test(ch)) {
          board.push(...Array(Number(ch)).fill(""));
        } else {
          board.push(ch);
        }
      }

      if (board.length !== 64) {
        throw new Error("Invalid puzzle position");
      }

      return { board, turn };
    }

    function applyMove(board, uci) {
      const next = board.slice();

      const from = sqIndex(uci.slice(0, 2));
      const to = sqIndex(uci.slice(2, 4));

      next[to] = next[from];
      next[from] = "";

      return next;
    }

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    function updateCoins() {
      coinEl.textContent = coins;
    }

    function loadPuzzle(idx) {
      currentIdx =
        ((idx % PUZZLES.length) + PUZZLES.length) %
        PUZZLES.length;

      const puzzle = PUZZLES[currentIdx];
      const parsed = parseFen(puzzle.fen);

      state = {
        board: parsed.board,
        turn: parsed.turn,
        selected: null,
        hintSq: null,
        lastMove: [],
        solved: false
      };

      countEl.textContent =
        `Puzzle ${currentIdx + 1} of ${PUZZLES.length}`;

      titleEl.textContent = puzzle.title;

      setStatus(
        parsed.turn === "w"
          ? "White to move."
          : "Black to move."
      );

      nextBtn.classList.remove("primary");
      hintBtn.disabled = false;

      renderBoard();
    }

    function renderBoard() {
      boardEl.replaceChildren();

      const flipped = state.turn === "b";

      for (let step = 0; step < 64; step++) {
        const i = flipped ? 63 - step : step;
        const row = Math.floor(i / 8);
        const col = i % 8;

        const square = document.createElement("button");
        square.type = "button";
        square.dataset.index = i;

        square.className =
          "sq " +
          ((row + col) % 2 === 0 ? "light" : "dark");

        if (state.selected === i) {
          square.classList.add("selected");
        }

        if (state.hintSq === i) {
          square.classList.add("hint");
        }

        if (state.lastMove.includes(i)) {
          square.classList.add("last");
        }

        const piece = state.board[i];

        square.setAttribute(
          "aria-label",
          piece
            ? `${sqName(i)} ${isWhite(piece) ? "white" : "black"} ${PIECE_NAMES[piece.toLowerCase()]}`
            : sqName(i)
        );

        if (piece) {
          const span = document.createElement("span");

          span.className =
            "piece " + (isWhite(piece) ? "w" : "b");

          span.textContent = GLYPHS[piece];
          span.setAttribute("aria-hidden", "true");

          square.appendChild(span);
        }

        square.addEventListener("click", () => {
          handleSquareClick(i);
        });

        boardEl.appendChild(square);
      }
    }

    function handleSquareClick(idx) {
      if (state.solved) return;

      const piece = state.board[idx];

      const isPlayerPiece =
        piece !== "" &&
        (state.turn === "w"
          ? isWhite(piece)
          : !isWhite(piece));

      if (state.selected === null) {
        if (isPlayerPiece) {
          state.selected = idx;
          state.hintSq = null;
          renderBoard();
        }
        return;
      }

      if (state.selected === idx) {
        state.selected = null;
        renderBoard();
        return;
      }

      if (isPlayerPiece) {
        state.selected = idx;
        renderBoard();
        return;
      }

      const attempt =
        sqName(state.selected) + sqName(idx);

      const puzzle = PUZZLES[currentIdx];

      if (attempt === puzzle.move) {
        state.board = applyMove(state.board, attempt);

        state.lastMove = [state.selected, idx];
        state.selected = null;
        state.hintSq = null;
        state.solved = true;

        hintBtn.disabled = true;
        nextBtn.classList.add("primary");

        if (!solvedIds.includes(puzzle.id)) {
          solvedIds.push(puzzle.id);
          writeStore(SOLVED_KEY, solvedIds);

          coins += 10;
          writeStore(COIN_KEY, coins);
          updateCoins();

          setStatus("Solved! +10 mooncoins.", "good");
        } else {
          setStatus(
            "Solved! You already earned coins for this puzzle.",
            "good"
          );
        }
      } else {
        state.selected = null;

        setStatus("Not quite — try again!", "bad");

        boardEl.classList.remove("shake");
        void boardEl.offsetWidth;
        boardEl.classList.add("shake");
      }

      renderBoard();
    }

    hintBtn.addEventListener("click", () => {
      if (state.solved) return;

      const move = PUZZLES[currentIdx].move;

      state.hintSq = sqIndex(move.slice(0, 2));

      setStatus("Hint: Move the highlighted piece.");
      renderBoard();
    });

    restartBtn.addEventListener("click", () => {
      loadPuzzle(currentIdx);
    });

    nextBtn.addEventListener("click", () => {
      loadPuzzle(currentIdx + 1);
    });

    
// Chess piece drag-and-drop

let drag = null;
let suppressClick = false;

function findBoardSquare(x, y) {
  const element = document.elementFromPoint(x, y);
  const square = element?.closest(".sq");

  if (!square || !boardEl.contains(square)) {
    return null;
  }

  return square;
}

function clearDropTargets() {
  boardEl.querySelectorAll(".drop-target").forEach(sq => {
    sq.classList.remove("drop-target");
  });
}

function cleanupDrag() {
  if (!drag) return;

  drag.ghost?.remove();

  if (drag.sourceSquare?.isConnected) {
    drag.sourceSquare.classList.remove("dragging");
  }

  clearDropTargets();

  drag = null;
}

boardEl.addEventListener("pointerdown", event => {
  if (state.solved || drag || !event.isPrimary) return;

  const square = event.target.closest(".sq");
  if (!square) return;

  const pieceElement = square.querySelector(".piece");
  if (!pieceElement) return;

  const squareIndex = Number(square.dataset.index);
  const piece = state.board[squareIndex];

  const isPlayerPiece =
    piece &&
    (state.turn === "w"
      ? isWhite(piece)
      : !isWhite(piece));

  if (!isPlayerPiece) return;

  drag = {
    pointerId: event.pointerId,
    from: squareIndex,
    startX: event.clientX,
    startY: event.clientY,
    sourceSquare: square,
    piece,
    ghost: null,
    moved: false
  };
});

document.addEventListener("pointermove", event => {
  if (!drag || event.pointerId !== drag.pointerId) return;

  const distance = Math.hypot(
    event.clientX - drag.startX,
    event.clientY - drag.startY
  );

  if (!drag.moved && distance < 6) return;

  if (!drag.moved) {
    drag.moved = true;

    const size = drag.sourceSquare.getBoundingClientRect().width;

    const ghost = document.createElement("div");
    ghost.className =
      "drag-piece " + (isWhite(drag.piece) ? "w" : "b");

    ghost.textContent = GLYPHS[drag.piece];
    ghost.style.width = size + "px";
    ghost.style.height = size + "px";
    ghost.style.fontSize = size * 0.8 + "px";

    document.body.appendChild(ghost);

    drag.ghost = ghost;
    drag.sourceSquare.classList.add("dragging");
  }

  event.preventDefault();

  drag.ghost.style.left = event.clientX + "px";
  drag.ghost.style.top = event.clientY + "px";

  clearDropTargets();

  const target = findBoardSquare(
    event.clientX,
    event.clientY
  );

  if (target && target !== drag.sourceSquare) {
    target.classList.add("drop-target");
  }
}, { passive: false });

document.addEventListener("pointerup", event => {
  if (!drag || event.pointerId !== drag.pointerId) return;

  const currentDrag = drag;
  const wasMoved = currentDrag.moved;

  const target = wasMoved
    ? findBoardSquare(event.clientX, event.clientY)
    : null;

  const targetIndex = target
    ? Number(target.dataset.index)
    : null;

  cleanupDrag();

  if (!wasMoved) return;

  suppressClick = true;

  // Prevent the release click from selecting another piece.
  setTimeout(() => {
    suppressClick = false;
  }, 0);

  if (targetIndex === null ||
      targetIndex === currentDrag.from) {
    return;
  }

  state.selected = currentDrag.from;
  handleSquareClick(targetIndex);
});

document.addEventListener("pointercancel", event => {
  if (drag && event.pointerId === drag.pointerId) {
    cleanupDrag();
  }
});

window.addEventListener("blur", cleanupDrag);

// Prevent a drag release from also triggering a click.
boardEl.addEventListener("click", event => {
  if (suppressClick) {
    event.stopImmediatePropagation();
    suppressClick = false;
  }
}, true);

    
    updateCoins();
    loadPuzzle(0);
  </script>
</body>
</html>
